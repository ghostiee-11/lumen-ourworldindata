name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC. Nothing here depends on the day; it exists so the checks
    # that talk to Our World In Data run even when nobody has pushed for a while.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check src tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,geo]"
      # Only the offline suite. The network tests hit Our World In Data for real and
      # would make CI fail on their outages rather than on our changes.
      - run: pytest tests -m "not network"

  live:
    # The guard that catches Our World In Data reshaping a table, renaming a column
    # or retiring an endpoint. Every bug of consequence in this package was found by
    # these tests rather than the mocked ones, so they need to run on their own
    # schedule; they stay off pull requests so a third-party outage never blocks a
    # merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,geo]"
      - run: pytest tests -m network

  links:
    # Moving the repository between owners left every documentation link in the
    # README pointing at a 404, and nothing noticed. Checked on the same schedule as
    # the live tests rather than on pull requests, since an unrelated site being
    # down is not a reason to block a merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # localhost addresses are documentation of where the dev server listens,
          # not links; nothing is serving them on a CI runner.
          args: >-
            --no-progress --max-retries 2
            --exclude '^https?://localhost' --exclude '^https?://127\.0\.0\.1'
            'README.md' 'docs/**/*.md'
          fail: true
