[project]
name = "lumen-ourworldindata-post"
version = "0.0.1"
description = "A data blog post built with Lumen and Our World In Data"
requires-python = ">=3.11"
dependencies = ["lumen[ai]", "holoviews", "panel", "pandas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits the live Our World In Data APIs"]
